<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cave Viewer</title>
    <script type="module" src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #eaeaea; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; background-color: #eaeaea; }
    </style>
</head>
<body>

    <!-- Added auto-rotate, bounds, and a light gray background to force visibility -->
    <model-viewer 
        src="BuzzardCaveA-v1.glb" 
        camera-controls 
        auto-rotate
        id="cave-viewer"
        alt="A 3D model of Buzzard Cave"
        shadow-intensity="1"
        exposure="1.5"
        bounds="tight">
    </model-viewer>

</body>
</html>
