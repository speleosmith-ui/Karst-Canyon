<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Cave Explorer</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #282c34;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
}
#control-panel {
  position: absolute;
  top: 15px;
  right: 15px;
  background: rgba(18, 20, 24, 0.94);
  color: white;
  padding: 16px;
  border-radius: 8px;
  border: 1px solid #444;
  z-index: 30;
  width: 270px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
}
.control-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.control-group label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #aaa;
}
.slider {
  width: 100%;
  cursor: pointer;
}
.btn-group {
  display: flex;
  gap: 5px;
}
.toggle-btn {
  flex: 1;
  background: #2b303c;
  border: 1px solid #4a5264;
  color: #ddd;
  padding: 7px;
  cursor: pointer;
  border-radius: 4px;
  font-size: 11px;
  transition: all 0.2s;
  font-weight: 500;
}
.toggle-btn.active {
  background: #007acc;
  border-color: #0098ff;
  color: white;
  font-weight: bold;
}
.action-btn {
  background: #28a745;
  border: 1px solid #34ce57;
  color: white;
  font-weight: bold;
  padding: 9px;
  border-radius: 4px;
  cursor: pointer;
  text-align: center;
  font-size: 12px;
}
.action-btn:hover {
  background: #218838;
}
.primary-btn {
  background: #007acc;
  border: 1px solid #0098ff;
  color: white;
  font-weight: bold;
  padding: 10px;
  border-radius: 4px;
  cursor: pointer;
  text-align: center;
  font-size: 13px;
}
.primary-btn:hover {
  background: #0062a3;
}
#status-display {
  position: absolute;
  bottom: 15px;
  left: 15px;
  color: #00ff88;
  font-family: monospace;
  font-size: 12px;
  background: rgba(10, 12, 16, 0.88);
  padding: 10px 14px;
  border-radius: 6px;
  z-index: 10;
  pointer-events: none;
  line-height: 1.5;
  border: 1px solid #333;
}
#crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 50%;
  pointer-events: none;
  z-index: 15;
  display: none;
}
#help-toast {
  position: absolute;
  top: 15px;
  left: 15px;
  background: rgba(15, 17, 21, 0.85);
  color: #eee;
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 10;
  border: 1px solid #444;
}
#file-input {
  display: none;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>

<input type="file" id="file-input" accept=".glb,.gltf">
<div id="crosshair"></div>
<div id="help-toast">🖱️ <b>Orbit Mode:</b> Drag to rotate | Scroll to zoom | Double-click cave to enter</div>

<div id="control-panel">
  <button id="btn-enter-fps" class="primary-btn">🎮 Enter Cave (1st Person)</button>
  <button id="btn-load-file" class="action-btn">📂 Open GLB Cave File</button>

  <div class="control-group">
    <label>Camera Mode</label>
    <div class="btn-group">
      <button id="btn-mode-orbit" class="toggle-btn active">Orbit View</button>
      <button id="btn-mode-fps" class="toggle-btn">1st Person</button>
      <button id="btn-mode-fly" class="toggle-btn">Fly Mode</button>
    </div>
  </div>

  <div class="control-group">
    <label>Render Style</label>
    <div class="btn-group">
      <button id="btn-render-lit" class="toggle-btn active">Lit</button>
      <button id="btn-render-unlit" class="toggle-btn">Full Bright</button>
      <button id="btn-render-wire" class="toggle-btn">Wireframe</button>
    </div>
  </div>

  <div class="control-group">
    <label id="lbl-brightness">Headlamp: 50.0</label>
    <input type="range" id="sld-brightness" class="slider" min="0" max="150" step="1" value="50">
  </div>

  <div class="control-group">
    <label id="lbl-ambient">Ambient Light: 2.0</label>
    <input type="range" id="sld-ambient" class="slider" min="0" max="5" step="0.1" value="2.0">
  </div>

  <button id="btn-reset-view" class="toggle-btn" style="margin-top: 4px;">🎯 Reset & Frame Model</button>
</div>

<div id="status-display">
MODEL: Loading...<br/>
CAMERA: ORBIT OVERVIEW<br/>
CONTROLS: Drag to Rotate | Scroll to Zoom
</div>

<script>
// --- Scene & Renderer Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x282c34); // Slate grey studio background

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 10000);
camera.position.set(0, 30, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Orbit Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxDistance = 1000;
controls.minDistance = 0.1;

// Base grid floor
const gridHelper = new THREE.GridHelper(100, 50, 0x00baee, 0x4f5866);
scene.add(gridHelper);

// --- Comprehensive Lighting ---
const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(ambientLight);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x555555, 1.2);
hemiLight.position.set(0, 100, 0);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(50, 100, 50);
scene.add(sunLight);

// Headlamp light attached to camera
const camLight = new THREE.PointLight(0xffffff, 50, 300, 0.5);
scene.add(camLight);

// --- State Variables ---
let currentCaveMesh = null;
let caveBounds = null;
let modelName = 'Loading...';
let renderStyle = 'lit';
let activeCameraMode = 'orbit';
let isPointerLocked = false;

// Player Position & Flight Navigation
const playerPos = new THREE.Vector3(0, 3, 0);
let yaw = 0;
let pitch = 0;
let speedMultiplier = 1;
const moveSpeed = 8.0;
const moveState = { forward: false, backward: false, left: false, right: false, moveUp: false, moveDown: false };

// --- DOM Elements ---
const controlPanel = document.getElementById('control-panel');
const fileInput = document.getElementById('file-input');
const btnLoadFile = document.getElementById('btn-load-file');
const btnEnterFPS = document.getElementById('btn-enter-fps');
const btnResetView = document.getElementById('btn-reset-view');
const btnModeOrbit = document.getElementById('btn-mode-orbit');
const btnModeFPS = document.getElementById('btn-mode-fps');
const btnModeFly = document.getElementById('btn-mode-fly');
const btnRenderLit = document.getElementById('btn-render-lit');
const btnRenderUnlit = document.getElementById('btn-render-unlit');
const btnRenderWire = document.getElementById('btn-render-wire');
const sldBrightness = document.getElementById('sld-brightness');
const lblBrightness = document.getElementById('lbl-brightness');
const sldAmbient = document.getElementById('sld-ambient');
const lblAmbient = document.getElementById('lbl-ambient');
const statusDisplay = document.getElementById('status-display');
const crosshair = document.getElementById('crosshair');
const helpToast = document.getElementById('help-toast');

controlPanel.addEventListener('click', (e) => e.stopPropagation());

// File Loader handlers
btnLoadFile.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) {
    loadCaveModel(URL.createObjectURL(e.target.files[0]), e.target.files[0].name);
  }
});

window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
    loadCaveModel(URL.createObjectURL(file), file.name);
  }
});

// Camera Mode Switching
function setCameraMode(mode) {
  activeCameraMode = mode;
  btnModeOrbit.classList.toggle('active', mode === 'orbit');
  btnModeFPS.classList.toggle('active', mode === 'fps');
  btnModeFly.classList.toggle('active', mode === 'fly');

  if (mode === 'orbit') {
    controls.enabled = true;
    crosshair.style.display = 'none';
    helpToast.innerHTML = '🖱️ <b>Orbit Mode:</b> Drag to rotate | Scroll to zoom | Double-click cave to enter';
    if (document.exitPointerLock) document.exitPointerLock();
  } else {
    controls.enabled = false;
    crosshair.style.display = 'block';
    helpToast.innerHTML = '🎮 <b>WASD:</b> Move | <b>Mouse:</b> Look | <b>Space/Ctrl:</b> Up/Down | <b>ESC:</b> Unlock Mouse';
    try {
      renderer.domElement.requestPointerLock();
    } catch(e) {}
  }
  updateStatusHUD();
}

btnModeOrbit.addEventListener('click', () => setCameraMode('orbit'));
btnModeFPS.addEventListener('click', () => setCameraMode('fps'));
btnModeFly.addEventListener('click', () => setCameraMode('fly'));
btnEnterFPS.addEventListener('click', () => setCameraMode('fps'));

document.addEventListener('pointerlockchange', () => {
  isPointerLocked = (document.pointerLockElement === renderer.domElement);
  if (!isPointerLocked && activeCameraMode !== 'orbit') {
    setCameraMode('orbit');
  }
});

// Double click to teleport & enter cave at click point
renderer.domElement.addEventListener('dblclick', (e) => {
  if (activeCameraMode !== 'orbit' || !currentCaveMesh) return;
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(currentCaveMesh, true);
  if (intersects.length > 0) {
    playerPos.copy(intersects[0].point);
    playerPos.y += 1.0;
    setCameraMode('fps');
  }
});

// Render Style handlers
function setRenderStyle(style) {
  renderStyle = style;
  btnRenderLit.classList.toggle('active', style === 'lit');
  btnRenderUnlit.classList.toggle('active', style === 'unlit');
  btnRenderWire.classList.toggle('active', style === 'wire');
  applyMaterialStyle();
}
btnRenderLit.addEventListener('click', () => setRenderStyle('lit'));
btnRenderUnlit.addEventListener('click', () => setRenderStyle('unlit'));
btnRenderWire.addEventListener('click', () => setRenderStyle('wire'));

function applyMaterialStyle() {
  if (!currentCaveMesh) return;
  currentCaveMesh.traverse((child) => {
    if (child.isMesh && child.material) {
      if (child.geometry) {
        child.geometry.computeVertexNormals();
      }
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach((m) => {
        m.side = THREE.DoubleSide;
        m.transparent = false;
        m.opacity = 1.0;
        m.vertexColors = false; // Prevent black photogrammetry vertex attributes
        m.depthWrite = true;

        if (renderStyle === 'wire') {
          m.wireframe = true;
          m.emissive = new THREE.Color(0x00ff88);
          m.emissiveMap = null;
        } else if (renderStyle === 'unlit') {
          m.wireframe = false;
          m.emissive = new THREE.Color(0xffffff);
          m.emissiveMap = m.map || null;
        } else {
          m.wireframe = false;
          m.emissive = new THREE.Color(0x111111);
          m.emissiveMap = null;
          m.roughness = 0.8;
          m.metalness = 0.05;
          if (!m.map) {
            m.color.setHex(0x8a929e); // Rock color fallback
          } else {
            m.color.setHex(0xffffff);
          }
        }
        m.needsUpdate = true;
      });
    }
  });
}

// Sliders
sldBrightness.addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  camLight.intensity = val;
  lblBrightness.innerText = `Headlamp: ${val.toFixed(1)}`;
});

sldAmbient.addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  ambientLight.intensity = val;
  hemiLight.intensity = val * 0.6;
  lblAmbient.innerText = `Ambient Light: ${val.toFixed(1)}`;
});

// Auto-frame cave in Orbit mode
function frameModel() {
  if (!caveBounds) return;
  const maxDim = Math.max(caveBounds.x, caveBounds.y, caveBounds.z);
  camera.position.set(0, maxDim * 0.7, maxDim * 1.3);
  controls.target.set(0, caveBounds.y * 0.4, 0);
  controls.update();
}
btnResetView.addEventListener('click', () => {
  setCameraMode('orbit');
  frameModel();
});

function updateStatusHUD() {
  const modeLabel = activeCameraMode === 'orbit' ? 'ORBIT OVERVIEW' : (activeCameraMode === 'fps' ? '1ST PERSON WALK' : 'FLY MODE');
  statusDisplay.innerHTML = 
    `MODEL: ${modelName}<br/>` +
    `CAMERA: ${modeLabel} | STYLE: ${renderStyle.toUpperCase()}<br/>` +
    `POS: [X:${playerPos.x.toFixed(1)} Y:${playerPos.y.toFixed(1)} Z:${playerPos.z.toFixed(1)}]`;
}

// Keyboard controls
document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    if (activeCameraMode !== 'orbit') setCameraMode('orbit');
    return;
  }
  if (e.code === 'KeyW') moveState.forward = true;
  if (e.code === 'KeyS') moveState.backward = true;
  if (e.code === 'KeyA') moveState.left = true;
  if (e.code === 'KeyD') moveState.right = true;
  if (e.code === 'Space') moveState.moveUp = true;
  if (e.code === 'ControlLeft' || e.code === 'ControlRight') moveState.moveDown = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') speedMultiplier = 2.5;
  if (e.code === 'KeyF') setCameraMode(activeCameraMode === 'fly' ? 'fps' : 'fly');
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'KeyW') moveState.forward = false;
  if (e.code === 'KeyS') moveState.backward = false;
  if (e.code === 'KeyA') moveState.left = false;
  if (e.code === 'KeyD') moveState.right = false;
  if (e.code === 'Space') moveState.moveUp = false;
  if (e.code === 'ControlLeft' || e.code === 'ControlRight') moveState.moveDown = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') speedMultiplier = 1;
});

document.addEventListener('mousemove', (e) => {
  if (!isPointerLocked) return;
  yaw -= e.movementX * 0.0025;
  pitch -= e.movementY * 0.0025;
  pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
});

// GLTF Loader
const loader = new THREE.GLTFLoader();
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(dracoLoader);

function loadCaveModel(url, displayName) {
  modelName = `Loading ${displayName}...`;
  updateStatusHUD();

  loader.load(
    url,
    (gltf) => {
      if (currentCaveMesh) scene.remove(currentCaveMesh);
      currentCaveMesh = gltf.scene;

      // Compute bounding box and center
      const box = new THREE.Box3().setFromObject(currentCaveMesh);
      const center = box.getCenter(new THREE.Vector3());
      caveBounds = box.getSize(new THREE.Vector3());

      // Center model at (0,0,0)
      currentCaveMesh.position.x -= center.x;
      currentCaveMesh.position.y -= box.min.y;
      currentCaveMesh.position.z -= center.z;

      applyMaterialStyle();
      scene.add(currentCaveMesh);

      // Adjust grid size to cave footprint
      gridHelper.position.y = 0;
      gridHelper.scale.set(caveBounds.x * 0.04, 1, caveBounds.z * 0.04);

      // Set initial player spawn
      playerPos.set(0, Math.max(1.5, caveBounds.y * 0.3), 0);

      modelName = `${displayName} (${Math.round(caveBounds.x)}m × ${Math.round(caveBounds.y)}m × ${Math.round(caveBounds.z)}m)`;
      
      // Start in Orbit mode so model is visible immediately
      setCameraMode('orbit');
      frameModel();
      updateStatusHUD();
    },
    undefined,
    (err) => {
      console.warn('GLB Load failed:', err);
      modelName = `Select .GLB file with top-right button`;
      updateStatusHUD();
    }
  );
}

// Auto-load default file
loadCaveModel('Buzzard Cave 2.0.glb', 'Buzzard Cave 2.0.glb');

// --- Animation Loop ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const deltaTime = Math.min(clock.getDelta(), 0.1);

  if (activeCameraMode === 'orbit') {
    controls.update();
    camLight.position.copy(camera.position);
  } else {
    // 1st Person & Fly Movement
    if (isPointerLocked) {
      const forward = new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, Math.sin(yaw));
      const moveVec = new THREE.Vector3();

      if (moveState.forward) moveVec.add(forward);
      if (moveState.backward) moveVec.sub(forward);
      if (moveState.left) moveVec.sub(right);
      if (moveState.right) moveVec.add(right);

      if (moveVec.lengthSq() > 0) {
        moveVec.normalize();
        playerPos.addScaledVector(moveVec, moveSpeed * speedMultiplier * deltaTime);
      }

      if (activeCameraMode === 'fly' || activeCameraMode === 'fps') {
        if (moveState.moveUp) playerPos.y += moveSpeed * speedMultiplier * deltaTime;
        if (moveState.moveDown) playerPos.y -= moveSpeed * speedMultiplier * deltaTime;
      }
    }

    camera.position.copy(playerPos);
    const lookDir = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch),
      Math.sin(pitch),
      -Math.cos(yaw) * Math.cos(pitch)
    ).normalize();
    camera.lookAt(camera.position.clone().add(lookDir));
    camLight.position.copy(camera.position);
    updateStatusHUD();
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
