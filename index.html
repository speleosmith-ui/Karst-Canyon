<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cave Viewer</title>
    <!-- Short script that cannot be cut off -->
    <script type="module" src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- This native tag handles lighting, loading, mouse controls, and rotation automatically -->
    <model-viewer 
        src="BuzzardCaveA-v1.glb" 
        camera-controls 
        interaction-prompt="auto" 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
