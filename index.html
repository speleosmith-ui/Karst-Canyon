<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cave Walkthrough</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }
        #instructions {
            font-size: 20px;
            line-height: 1.6;
        }
    </style>
    <!-- Stable Framework Elements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            <span style="font-size:36px; font-weight:bold;">Click to Explore Cave</span><br/><br/>
            Move: WASD or Arrow Keys<br/>
            Look: Move your Mouse<br/>
            Crouch: Hold LEFT CTRL or C<br/>
            Exit: ESC key
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Positioned close to world center to ensure visibility
        camera.position.set(0, 2, 5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Flooding environment with bright light to bypass darkness errors
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xffffff, 15, 100, Math.PI / 5, 0.5, 1);
        scene.add(flashlight);
        scene.add(flashlight.target);

        const controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        const blocker = document.getElementById('blocker');
        blocker.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'flex');

        const moveState = { forward: false, backward: false, left: false, right: false, crouching: false };
        let currentSpeed = 30.0;
        const STAND_HEIGHT = 2.0;
        const CROUCH_HEIGHT = 0.8;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = true;
            if (e.code === 'ControlLeft' || e.code === 'KeyC') {
                moveState.crouching = true;
                currentSpeed = 10.0;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = false;
            if (e.code === 'ControlLeft' || e.code === 'KeyC') {
                moveState.crouching = false;
                currentSpeed = 30.0;
            }
        });

        console.log("Initializing asset loader modules...");
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        
        // Pointing to official public unpacker repository
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        console.log("Requesting cave data asset file from server level...");
        loader.load('BuzzardCaveA-v1.glb', function (gltf) {
            scene.add(gltf.scene);
            console.log('SUCCESS: Draco-compressed cave model parsed and added to scene graph!');
        }, function (xhr) {
            if (xhr.total > 0) {
                console.log('Loading progress: ' + Math.round((xhr.loaded / xhr.total * 100)) + '%');
            }
        }, function (error) {
            console.error('ERROR: Failed to unpack or parse model asset:', error);
        });

        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();

            if (controls.isLocked) {
                velocity.set(0, 0, 0);
                if (moveState.forward) velocity.z -= 1;
                if (moveState.backward) velocity.z += 1;
                if (moveState.left) velocity.x -= 1;
                if (moveState.right) velocity.x += 1;
                
                velocity.normalize();
                controls.moveForward(-velocity.z * currentSpeed * deltaTime);
                controls.moveRight(velocity.x * currentSpeed * deltaTime);

                let targetHeight = moveState.crouching ? CROUCH_HEIGHT : STAND_HEIGHT;
                camera.position.y += (targetHeight - camera.position.y) * 0.15;
            }

            flashlight.position.copy(camera.position);
            const vector = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            flashlight.target.position.copy(camera.position).add(vector);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
