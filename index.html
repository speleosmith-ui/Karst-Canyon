<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js WASD Navigation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        #blocker { position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; color: white; font-family: sans-serif; text-align: center; cursor: pointer; z-index: 10; }
        #instructions { font-size: 20px; line-height: 1.6; }
    </style>

    <!-- Hardcoded Scripts: Bypasses the fragile import map entirely -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <span style="font-size:36px; font-weight:bold;">Click to Start</span><br/><br/>
            Move: WASD keys<br/>
            Look: Move your Mouse<br/>
            Exit: ESC key
        </div>
    </div>

    <script>
        // 1. Core Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5); // Start slightly up and back

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting 
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. Controls Setup
        const controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        const blocker = document.getElementById('blocker');
        blocker.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'flex');

        // 4. Keyboard State Tracking
        const moveState = { forward: false, backward: false, left: false, right: false };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = false;
        });

        // 5. Load your exported GLB Model
        const loader = new THREE.GLTFLoader();
        loader.load('BuzzardCaveA-v1.glb', function (gltf) {
            scene.add(gltf.scene);
            console.log("Model loaded successfully!");
        }, undefined, function (error) {
            console.error("Error loading model:", error);
        });

        // 6. Animation and Movement Loop
        const clock = new THREE.Clock();
        const moveSpeed = 12.0; 
        const velocity = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();

            if (controls.isLocked) {
                velocity.set(0, 0, 0);

                if (moveState.forward) velocity.z -= 1;
                if (moveState.backward) velocity.z += 1;
                if (moveState.left) velocity.x -= 1;
                if (moveState.right) velocity.x += 1;

                velocity.normalize();

                controls.moveForward(-velocity.z * moveSpeed * deltaTime);
                controls.moveRight(velocity.x * moveSpeed * deltaTime);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
